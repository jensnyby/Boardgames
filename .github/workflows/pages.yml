# Publicerar mappen public/ på GitHub Pages vid varje push till main.
# Kräver att repot är publikt (eller GitHub Pro) och att Settings → Pages → Source = "GitHub Actions".
name: Publicera på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Lägg versionsnummer på js- och css-filerna så att webbläsare inte använder gamla sparade kopior.
      - name: Versionsmärk filer
        run: sed -i -E 's/\.(js|css)"/.\1?v=${{ github.sha }}"/g' public/index.html public/spela.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
